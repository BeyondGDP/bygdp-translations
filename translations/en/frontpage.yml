intro_title: 17 goals to transform our world
title: ''
description: Gross domestic product (GDP) is an important indicator of a country’s economic development.
However, it can only partially reflect social progress and well-being. The Beyond-GDP approach therefore
broadens the perspective to include additional economic, social, and environmental dimensions.<br><br>
The United Nations has proposed a set of 31 indicators for this purpose, covering various aspects of
well-being, equality, and participation, as well as sustainability and resilience.<br><br>
The Beyond-GDP Dashboard for Germany shows the extent to which the proposed indicators can be depicted using
available data for Germany. Where data is available, trends over time are presented.
