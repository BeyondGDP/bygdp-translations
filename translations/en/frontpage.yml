intro_title: 17 goals to transform our world
title: ''
description: Gross Domestic Product (GDP) is a key indicator for measuring economic development.
  However, a comprehensive assessment of social progress requires consideration of further economic,
  social and environmental aspects.
  The United Nations’ High-Level Expert Group on Beyond GDP has developed a framework comprising 31
  indicators for this purpose. These indicators capture various dimensions of well-being and sustainable
  development. These include current well-being, equality and participation, as well as sustainability and
  resilience. Just under half of the indicators are based on the global indicators of the Sustainable
  Development Goals (SDGs).
  The Beyond GDP Dashboard for Germany illustrates the trends in these 31 indicators using data for Germany.
  Where available, time series and supplementary information are provided to help contextualise the results.
  The dashboard thus broadens the perspective beyond economic development and highlights other key aspects of
  social progress.
