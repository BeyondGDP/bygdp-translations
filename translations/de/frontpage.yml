title: ''
description: "Das Bruttoinlandsprodukt (BIP; englisch: Gross Domestic Product, GDP) ist ein zentraler
Indikator zur Beschreibung der wirtschaftlichen Entwicklung. Für eine umfassende Betrachtung des
gesellschaftlichen Fortschritts sind jedoch weitere ökonomische, soziale und ökologische Aspekte von
Bedeutung.<br>Die High-Level Expert Group on Beyond GDP der Vereinten Nationen hat hierfür einen
Rahmen mit 31 Indikatoren entwickelt. Sie bilden verschiedene Dimensionen des Wohlergehens und der
nachhaltigen Entwicklung ab. Dazu zählen aktuelles Wohlergehen, Gleichheit und Teilhabe sowie Nachhaltigkeit
und Resilienz.<br>Das Beyond-GDP-Dashboard für Deutschland stellt die Entwicklung
dieser Indikatoren anhand von Daten für Deutschland dar. Soweit verfügbar, werden Zeitreihen und 
ergänzende Informationen zur Einordnung der Ergebnisse bereitgestellt. Das Dashboard erweitert damit den
Blick über die wirtschaftliche Entwicklung hinaus und macht weitere zentrale Aspekte des gesellschaftlichen
Fortschritts sichtbar."
