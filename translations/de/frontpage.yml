title: ''
description: "Das Bruttoinlandsprodukt (BIP) ist ein wichtiger Indikator für die wirtschaftliche Entwicklung eines Landes.
Gesellschaftlicher Fortschritt und Wohlergehen lassen sich damit jedoch nur teilweise abbilden. Der Beyond-GDP Ansatz
erweitert daher die Perspektive um weitere ökonomische, soziale und ökologische Dimensionen.<br>
Die Vereinten Nationen haben hierfür ein Set von 31 Indikatoren vorgeschlagen, das unterschiedliche Aspekte von Wohlergehen,
Gleichheit und Teilhabe sowie Nachhaltigkeit und Resilienz umfasst.<br>
Das Beyond-GDP Dashboard für Deutschland zeigt, inwieweit die vorgeschlagenen Indikatoren anhand verfügbarer Daten für
Deutschland abgebildet werden können. Wo Daten vorliegen, werden Entwicklungen im Zeitverlauf dargestellt."
